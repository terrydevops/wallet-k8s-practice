# Binary in apps/go/cmd to run. Also used as the container name.
cmd: quote-prober

image:
  repository: wallet-k8s-practice/quote-prober
  # A release pins the image by digest (written by release.yml when the chart is packaged).
  # Otherwise tag is used, defaulting to the chart's appVersion. Never "latest".
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

# Digest per cmd, written by release.yml into the packaged chart so a chart version pins every image
# it can run. Used when image.digest is empty. Empty in git: local builds use the tag.
digests: {}

replicas: 1
port: 8080

# Plain settings, rendered as env vars.
env: {}

# Name of an existing Secret whose keys become env vars (credentials). Created outside the chart
# (`make secret`, later an ExternalSecret).
secretEnvFrom: ""

# Optional scenarios.yaml content. When set, it is mounted and SCENARIOS_FILE points at it;
# otherwise the file baked into the image is used.
scenarios: ""

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 64Mi }

# Post-deploy check (quote-prober only): a Job that runs `quote-prober verify` against the new
# release and passes once every scenario has a successful quote no older than maxAge. Rendered as a
# Helm post-install/post-upgrade hook, which Argo CD runs as a PostSync hook: a failing check marks
# the sync as failed. timeout must stay under the Job's 6-minute deadline.
postDeployCheck:
  enabled: false
  maxAge: 3m
  timeout: 4m

metrics:
  serviceMonitor:
    enabled: true
    interval: 30s

# Dashboards are installed once per cluster from deploy/dashboards, not per release.
