# One Application per (environment, app): for every deploy/envs/<env>/version.yaml with a version set,
# and every deploy/envs/<env>/<app>.yaml in that folder. prod is never auto-synced.
#
# Each Application installs the released chart (OCI, digests baked in) at that version, with values:
#   1. deploy/apps/<app>.yaml at the release tag vX.Y.Z: app defaults move with the chart they were
#      written for, so a default that needs a newer chart cannot break an environment still on an
#      older one (a strict values schema would reject it and the Application could not render);
#   2. deploy/envs/<env>/<app>.yaml at main: environment overrides, limited by hack/check-env-values.py
#      to keys every chart version accepts, so they apply without a release.
#
# Helm fills in the repo, revision and registry placeholders; every {{ }} is the ApplicationSet's.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: __REPO_URL__
              revision: __REVISION__
              pathParamPrefix: env
              files:
                - path: deploy/envs/*/version.yaml
            selector:
              matchExpressions:
                - {key: version, operator: NotIn, values: [""]}
          - git:
              repoURL: __REPO_URL__
              revision: __REVISION__
              pathParamPrefix: app
              files:
                - path: "deploy/envs/{{ .env.path.basename }}/*.yaml"
                - path: "deploy/envs/{{ .env.path.basename }}/namespace.yaml"
                  exclude: true
                - path: "deploy/envs/{{ .env.path.basename }}/version.yaml"
                  exclude: true
  template:
    metadata:
      name: '{{ .env.path.basename }}-{{ trimSuffix ".yaml" .app.path.filename }}'
      labels:
        wallet/env: '{{ .env.path.basename }}'
        wallet/app: '{{ trimSuffix ".yaml" .app.path.filename }}'
    spec:
      project: wallet
      sources:
        - repoURL: __REGISTRY__/charts
          chart: go-service
          targetRevision: '{{ .version }}'
          helm:
            releaseName: '{{ trimSuffix ".yaml" .app.path.filename }}'
            valueFiles:
              - '$release/deploy/apps/{{ trimSuffix ".yaml" .app.path.filename }}.yaml'
              - '$values/{{ .app.path.path }}/{{ .app.path.filename }}'
            parameters:
              - name: image.repository
                value: '__REGISTRY__/{{ trimSuffix ".yaml" .app.path.filename }}'
        - repoURL: __REPO_URL__
          targetRevision: 'v{{ .version }}'
          ref: release
        - repoURL: __REPO_URL__
          targetRevision: __REVISION__
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: 'wallet-{{ .env.path.basename }}'
  templatePatch: |
    {{- if ne .env.path.basename "prod" }}
    spec:
      syncPolicy:
        automated: {prune: true, selfHeal: true}
    {{- end }}
